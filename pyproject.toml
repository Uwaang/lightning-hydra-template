[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning-hydra-template"
version = "0.1.0"
description = "A modern PyTorch Lightning and Hydra template for reproducible vision experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.14,<2.15",
  "torchvision>=0.29,<0.30",
  "lightning>=2.6.6,<2.7",
  "torchmetrics>=1.9,<2.0",
  "hydra-core>=1.3.7,<1.4",
  "hydra-colorlog>=1.2,<2.0",
  "rootutils>=1.0,<2.0",
  "rich>=15,<16",
]

[project.optional-dependencies]
vision = [
  "albumentations>=2.0,<3",
  "h5py>=3.11,<4",
  "opencv-python-headless>=4.10,<5",
]
model-zoo = [
  "timm>=1.0.30,<2",
  "segmentation-models-pytorch>=0.5,<0.6",
]
interpretability = [
  "albumentations>=2.0,<3",
  "h5py>=3.11,<4",
  "opencv-python-headless>=4.10,<5",
  "grad-cam>=1.5.7,<2",
]
sweeps = [
  "hydra-optuna-sweeper==1.2.0",
  "optuna==2.10.1",
]
onnx = [
  "onnx>=1.23.1,<1.24",
  "onnxscript>=0.7.2,<0.8",
  "onnxruntime>=1.24.3,<1.24.4; python_version < '3.11'",
  "onnxruntime>=1.30,<1.31; python_version >= '3.11'",
]
all = [
  "albumentations>=2.0,<3",
  "h5py>=3.11,<4",
  "opencv-python-headless>=4.10,<5",
  "timm>=1.0.30,<2",
  "segmentation-models-pytorch>=0.5,<0.6",
  "grad-cam>=1.5.7,<2",
  "hydra-optuna-sweeper==1.2.0",
  "optuna==2.10.1",
  "onnx>=1.23.1,<1.24",
  "onnxscript>=0.7.2,<0.8",
  "onnxruntime>=1.24.3,<1.24.4; python_version < '3.11'",
  "onnxruntime>=1.30,<1.31; python_version >= '3.11'",
]

[project.scripts]
train-command = "src.train:main"
eval-command = "src.eval:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6,<5",
  "pytest>=9.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<0.17",
  "sh; platform_system != 'Windows'",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv]
required-version = "==0.12.17"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
  "pragma: nocover",
  "raise NotImplementedError",
  "raise NotImplementedError()",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 99
extend-exclude = ["logs", "data", "*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E402", "E501", "F401", "F841"]

[tool.ruff.format]
docstring-code-format = true
