# Run all quality checks against the complete repository on main.

name: Code Quality Main

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Check lockfile freshness
        run: uv lock --check

      - name: Install quality tools
        run: uv sync --python 3.12 --only-group dev

      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: Run project-local mypy
        run: uv run --no-sync mypy
