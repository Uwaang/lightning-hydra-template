# Run all pre-commit hooks against the complete repository on main.

name: Code Quality Main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: python -m pip install "pre-commit>=4.6,<5"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
