name: Lock Candidate

on:
  push:
    branches: ["ci/project-local-mypy"]
    paths:
      - pyproject.toml
      - .github/workflows/lock-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"

      - name: Refresh lockfile
        run: uv lock

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already current"
          else
            git commit -m "chore: refresh uv lock for mypy"
            git push origin HEAD:ci/project-local-mypy
          fi
