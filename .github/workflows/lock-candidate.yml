name: Lock Candidate

on:
  push:
    branches: ["modernize/2026-stack"]
    paths:
      - pyproject.toml
      - .github/workflows/lock-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"

      - name: Refresh lockfile
        run: uv lock

      - name: Upload candidate lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock-candidate
          path: uv.lock
          if-no-files-found: error
