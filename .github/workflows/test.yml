name: Tests

on:
  push:
    branches: [main, "integration/**", "feature/**"]
  pull_request:
    branches: [main, "integration/**", "release/*", "dev"]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: List dependencies
        run: python -m pip list

      - name: Run core tests
        run: python -m pytest -m "not slow" -v

  vision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/vision.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.14,<2.15" "torchvision>=0.29,<0.30"

      - name: Install vision dependencies
        run: |
          python -m pip install -r requirements/vision.txt
          python -m pip install -e .

      - name: Run image data tests
        run: python -m pytest tests/test_image_data.py -v

  full-stack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.14,<2.15" "torchvision>=0.29,<0.30"

      - name: Install full dependency set
        run: |
          python -m pip install -r requirements/all.txt
          python -m pip install -e .

      - name: Run non-slow full suite
        run: python -m pytest -m "not slow" -v

      - name: Run integration smoke tests
        run: |
          python -m pytest             tests/test_sweeps.py::test_example_experiment             tests/test_sweeps.py::test_hydra_sweep             tests/test_sweeps.py::test_optuna_sweep             -v

  code-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest-cov

      - name: Run tests and collect coverage
        run: python -m pytest -m "not slow" --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
