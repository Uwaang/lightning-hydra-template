name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, "integration/**", "release/*", "dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Show environment
        run: |
          uv --version
          uv run python --version
          uv run python -c "import torch; print(torch.__version__)"

      - name: Run core tests
        run: uv run python -m pytest -m "not slow" -v

  vision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync vision environment
        run: uv sync --python 3.12 --extra vision

      - name: Run image data tests
        run: uv run python -m pytest tests/test_image_data.py -v

  onnx-tests:
    name: ONNX / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync ONNX environment
        run: uv sync --python ${{ matrix.python-version }} --extra onnx

      - name: Show ONNX Runtime version
        run: uv run python -c "import onnxruntime; print(onnxruntime.__version__)"

      - name: Run export and runtime benchmark tests
        run: |
          uv run python -m pytest tests/test_export_utils.py tests/test_benchmark_utils.py -v

  full-stack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync full environment
        run: uv sync --python 3.12 --all-extras

      - name: Run non-slow full suite
        run: uv run python -m pytest -m "not slow" -v

      - name: Run integration smoke tests
        run: |
          uv run python -m pytest tests/test_sweeps.py::test_example_experiment tests/test_sweeps.py::test_hydra_sweep tests/test_sweeps.py::test_optuna_sweep -v

  code-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --python 3.12

      - name: Run tests and collect coverage
        run: uv run python -m pytest -m "not slow" --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
