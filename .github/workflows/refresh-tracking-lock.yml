name: Refresh tracking lock

on:
  push:
    branches: [feat/standard-experiment-tracking]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/standard-experiment-tracking

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Refresh lockfile
        run: uv lock

      - name: Commit lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv lock for tracking extra"
          git push
