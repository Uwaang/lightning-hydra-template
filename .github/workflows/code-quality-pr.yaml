# Run all pre-commit hooks for pull requests.
# The repository is small enough that running the complete hook set is simpler
# and more reliable than maintaining changed-file detection.

name: Code Quality PR

on:
  pull_request:
    branches: [main, "release/*", "dev"]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: python -m pip install "pre-commit>=4.6,<5"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
