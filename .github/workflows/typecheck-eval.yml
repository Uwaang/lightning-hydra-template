name: Type Checker Evaluation

on:
  push:
    branches: ["experiment/type-checkers"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: ${{ matrix.checker }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        checker: [ty, pyright, mypy]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync full environment
        run: uv sync --python 3.12 --all-extras

      - name: Run ty
        if: matrix.checker == 'ty'
        continue-on-error: true
        run: uvx ty@0.0.84 check src

      - name: Run Pyright
        if: matrix.checker == 'pyright'
        continue-on-error: true
        run: uvx pyright src

      - name: Run mypy
        if: matrix.checker == 'mypy'
        continue-on-error: true
        run: uvx mypy src --ignore-missing-imports
