# @package _global_

# Multi-objective smoke/reference:
# uv run train-command -m hparams_search=mnist_optuna_pareto experiment=example

defaults:
  - override /hydra/sweeper: optuna

optimized_metric: null
optimized_metrics:
  - "val/acc_best"
  - "model/params"

hydra:
  mode: "MULTIRUN"

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    storage: null
    study_name: null
    n_jobs: 1

    # Objective order matches optimized_metrics above.
    direction:
      - maximize
      - minimize

    n_trials: 20

    sampler:
      _target_: optuna.samplers.NSGAIISampler
      seed: 1234
      population_size: 10

    params:
      model.optimizer.lr: tag(log, interval(0.0001, 0.1))
      data.batch_size: choice(32, 64, 128, 256)
      model.net.lin1_size: choice(64, 128, 256)
      model.net.lin2_size: choice(64, 128, 256)
      model.net.lin3_size: choice(32, 64, 128, 256)
