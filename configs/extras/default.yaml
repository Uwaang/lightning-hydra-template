# disable python warnings if they annoy you
ignore_warnings: False

# ask user for tags if none are provided in the config
enforce_tags: True

# pretty print config tree at the start of the run using Rich library
print_config: True

# save pip/git/GPU metadata and snapshots of src/ and configs/
log_metadata: False

# plain PyTorch state-dict export
state_dict:
  strip_prefix: "net."
  exclude_prefixes: []

# prediction export
predictions:
  output_format: "json"

# research-friendly reporting when a logger is configured
reporting:
  enabled: True
  top_k: 3
  class_names: null
  log_metadata: True
  log_state_dicts: True
  log_best_checkpoint: True
  log_prediction_table: True
  prediction_table_max_rows: 500
  log_learning_rate: True
  log_epoch_time: True
  log_system_metrics: True
  log_dataset_provenance: True
  log_existing_exports: True
