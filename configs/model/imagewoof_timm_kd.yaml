_target_: src.models.classification_module.ClassificationLitModule

num_classes: 10

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0003
  weight_decay: 0.01

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 12
  eta_min: 0.000001

loss:
  _target_: torch.nn.CrossEntropyLoss
  label_smoothing: 0.0

net:
  _target_: src.models.components.adapters.TimmClassifier
  model_name: mobilenetv3_small_100.lamb_in1k
  num_classes: ${model.num_classes}
  pretrained: true
teacher:
  _target_: src.models.components.adapters.TimmClassifier
  model_name: resnet18.a1_in1k
  num_classes: ${model.num_classes}
  pretrained: false

teacher_state_dict_path: ${paths.log_dir}/benchmarks/imagewoof/teacher/best_state_dict.pt
distillation_alpha: 0.5
distillation_temperature: 4.0

compile: false
