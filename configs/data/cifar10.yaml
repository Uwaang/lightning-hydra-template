_target_: src.data.cifar10_datamodule.CIFAR10DataModule

data_dir: ${paths.data_dir}
train_val_split: [45000, 5000]
batch_size: 128
num_workers: 0
pin_memory: True
split_seed: 42

batch_augmentation:
  _target_: src.data.components.transforms.ClassificationBatchCollate
  num_classes: ${model.num_classes}
  mode: none
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
