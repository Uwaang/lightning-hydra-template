_target_: src.data.image_datamodule.ImageDataModule
_recursive_: False

datasets:
  train:
    _target_: src.data.image_dataset.ClassificationImageDataset
    manifest_path: ${paths.data_dir}/imagewoof2-160/manifests/train.json
    root_dir: ${paths.data_dir}/imagewoof2-160
    label_dtype: long

  val:
    _target_: src.data.image_dataset.ClassificationImageDataset
    manifest_path: ${paths.data_dir}/imagewoof2-160/manifests/val.json
    root_dir: ${paths.data_dir}/imagewoof2-160
    label_dtype: long
    include_name: True

  test:
    _target_: src.data.image_dataset.ClassificationImageDataset
    manifest_path: ${paths.data_dir}/imagewoof2-160/manifests/test.json
    root_dir: ${paths.data_dir}/imagewoof2-160
    label_dtype: long
    include_name: True
  predict:
    _target_: src.data.image_dataset.ClassificationImageDataset
    manifest_path: ${paths.data_dir}/imagewoof2-160/manifests/test.json
    root_dir: ${paths.data_dir}/imagewoof2-160
    label_dtype: long
    include_name: True

transforms:
  train:
    _target_: src.data.components.transforms.TorchvisionV2Transform
    operations:
      - _target_: torchvision.transforms.v2.RandomResizedCrop
        size: [160, 160]
        scale: [0.7, 1.0]
        antialias: True
      - _target_: torchvision.transforms.v2.RandomHorizontalFlip
        p: 0.5
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  val:
    _target_: src.data.components.transforms.TorchvisionV2Transform
    operations:
      - _target_: torchvision.transforms.v2.Resize
        size: [176, 176]
        antialias: True
      - _target_: torchvision.transforms.v2.CenterCrop
        size: [160, 160]
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  test: ${data.transforms.val}
  predict: ${data.transforms.val}

batch_augmentation:
  _target_: src.data.components.transforms.ClassificationBatchCollate
  num_classes: ${model.num_classes}
  mode: none
  mixup_alpha: 0.2
  cutmix_alpha: 1.0

loaders:
  train:
    batch_size: 64
    shuffle: True
    num_workers: 4
    pin_memory: True
    drop_last: True
    persistent_workers: True

  val:
    batch_size: 64
    shuffle: False
    num_workers: 4
    pin_memory: True
    drop_last: False
    persistent_workers: True

  test:
    batch_size: 64
    shuffle: False
    num_workers: 4
    pin_memory: True
    drop_last: False
    persistent_workers: True

  predict:
    batch_size: 64
    shuffle: False
    num_workers: 4
    pin_memory: True
    drop_last: False
    persistent_workers: True
