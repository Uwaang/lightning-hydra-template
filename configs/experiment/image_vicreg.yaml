# @package _global_

defaults:
  - override /data: image_vicreg
  - override /model: image_vicreg
  - override /trainer: default

tags: ["image-vicreg", "self-supervised"]
seed: 42

trainer:
  max_epochs: 100

# VICReg does not produce a classification accuracy metric during pretraining.
callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
  early_stopping:
    monitor: "val/loss"
    mode: "min"
